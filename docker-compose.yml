version: "3.9"

services:
  app:
    build: .
    ports:
      - "5200:5200"
    env_file:
      - .env.local
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5200/api/health')\""]
      interval: 10s
      timeout: 3s
      retries: 5
